services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exam123456
      POSTGRES_DB: postgres
      LANG: C.UTF-8
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  exam_postgres_data:
